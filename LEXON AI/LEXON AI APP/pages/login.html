<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">
  <meta name="description" content="Login to LEXON AI">

  <title>Login — LEXON AI</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    window.lexonTurnstileToken = null;
    window.onTurnstileVerified = function (token) {
      window.lexonTurnstileToken = token;
    };
  </script>
</head>

<body class="auth-page">

  <main class="auth-container">

    <section class="auth-card">

      <a href="../index.html" class="auth-brand" aria-label="LEXON AI Home">
        <span class="brand-mark"><img src="../assets/logos/lexon-icon.svg" alt="LEXON AI"></span>
        <span class="brand-name">LEXON AI</span>
      </a>

      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue your AI learning journey.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>

        <div class="form-group">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="password">Password</label>

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              Show
            </button>
          </div>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div
          id="loginMessage"
          class="form-message"
          role="alert"
          aria-live="polite"
        ></div>

        <div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY" data-callback="onTurnstileVerified" style="margin: 4px 0;"></div>

        <button
          type="submit"
          class="btn btn-primary auth-submit"
          id="loginButton"
        >
          <span id="loginButtonText">Sign in</span>
        </button>

      </form>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html">Create account</a>
      </p>

    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById("loginForm");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const button = document.getElementById("loginButton");
      const buttonText = document.getElementById("loginButtonText");
      const message = document.getElementById("loginMessage");
      const toggle = document.getElementById("togglePassword");

      if (toggle && password) {
        toggle.addEventListener("click", function () {
          const hidden = password.type === "password";

          password.type = hidden ? "text" : "password";
          toggle.textContent = hidden ? "Hide" : "Show";
          toggle.setAttribute(
            "aria-label",
            hidden ? "Hide password" : "Show password"
          );
        });
      }

      if (!form) return;

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "";
        message.className = "form-message";

        const emailValue = email.value.trim();
        const passwordValue = password.value;

        if (!emailValue || !passwordValue) {
          message.textContent =
            "Please enter your email and password.";
          message.classList.add("error");
          return;
        }

        button.disabled = true;
        buttonText.textContent = "Signing in...";

        try {

          if (
            !window.LexonAuth ||
            typeof window.LexonAuth.login !== "function"
          ) {
            throw new Error(
              "Authentication is currently unavailable."
            );
          }

          const result = await window.LexonAuth.login(
            emailValue,
            passwordValue,
            window.lexonTurnstileToken
          );

          if (!result.success) {
            throw new Error(
              result.error || "Unable to sign in."
            );
          }

          if (result.onboardingComplete) {
            window.location.href = "../index.html";
            return;
          }

          window.location.href = "onboarding.html";

        } catch (error) {

          message.textContent =
            error.message ||
            "Something went wrong. Please try again.";

          message.classList.add("error");

          button.disabled = false;
          buttonText.textContent = "Sign in";
        }
      });

    });
  </script>

</body>
</html>
