<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">
    <meta name="description" content="Explore AI courses and learning paths.">
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>Courses</title>
    <style>
        .page-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 110px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
        }

        .page-header p {
            margin: 0;
            color: #667085;
            max-width: 620px;
        }

        .course-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .course-search {
            flex: 1 1 280px;
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 16px;
            background: var(--lexon-surface);
            color: var(--lexon-text);
            font: inherit;
            outline: none;
        }

        .course-search:focus {
            border-color: var(--lexon-accent);
            box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.1);
        }

        .course-filter {
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 40px 0 14px;
            background: var(--lexon-surface);
            color: #344054;
            font: inherit;
            cursor: pointer;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .course-card {
            display: flex;
            flex-direction: column;
            min-height: 260px;
            padding: 22px;
            border: 1px solid #eaecf0;
            border-radius: 20px;
            background: var(--lexon-surface);
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.05);
        }

        .course-card[hidden] {
            display: none;
        }

        .course-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #f4f3ff;
            color: var(--lexon-accent);
            margin-bottom: 18px;
        }

        .course-icon svg {
            width: 23px;
            height: 23px;
        }

        .course-card h2 {
            margin: 0 0 9px;
            font-size: 19px;
            line-height: 1.35;
            color: var(--lexon-text);
        }

        .course-card p {
            margin: 0;
            color: #667085;
            line-height: 1.6;
            font-size: 14px;
        }

        .course-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 20px;
        }

        .course-tag {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            background: #f2f4f7;
            color: #475467;
            font-size: 12px;
            font-weight: 600;
        }

        .course-link {
            margin-left: auto;
            color: var(--lexon-accent);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .course-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 64px 24px;
            border: 1px dashed #d0d5dd;
            border-radius: 20px;
            background: #fcfcfd;
        }

        .empty-state.visible {
            display: block;
        }

        .empty-state-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #f2f4f7;
            color: #667085;
        }

        .empty-state h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: var(--lexon-text);
        }

        .empty-state p {
            margin: 0 auto;
            max-width: 480px;
            color: #667085;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .courses-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                width: min(100% - 24px, 1180px);
                padding-top: 24px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .course-card {
                min-height: 240px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="brand" aria-label="Home">
                <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
                <span class="brand-name">LEXON AI</span>
            </a>

            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="../index.html">Home</a>
                <a href="videos.html">Videos</a>
                <a class="active" href="courses.html">Courses</a>
                <a href="tools.html">Tools</a>
                <a href="guides.html">Guides</a>
            </nav>

            <div class="header-actions">
                <button class="icon-button" type="button" id="notificationButton" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <a href="profile.html" class="avatar-link" aria-label="Profile">
                    <span class="avatar" id="profileAvatar">?</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-header">
            <div>
                <h1>Courses</h1>
                <p>Build practical AI skills with structured learning experiences.</p>
            </div>
        </section>

        <section class="course-toolbar" aria-label="Course filters">
            <input
                class="course-search"
                id="courseSearch"
                type="search"
                placeholder="Search courses..."
                autocomplete="off"
                aria-label="Search courses"
            >

            <select class="course-filter" id="courseCategory" aria-label="Filter courses by category">
                <option value="all">All categories</option>
                <option value="ai-basics">AI Basics</option>
                <option value="prompt-engineering">Prompt Engineering</option>
                <option value="ai-content">AI Content</option>
                <option value="ai-automation">AI Automation</option>
                <option value="ai-coding">AI Coding</option>
                <option value="ai-agents">AI Agents</option>
            </select>
        </section>

        <section class="courses-grid" id="coursesGrid" aria-live="polite"></section>

        <section class="empty-state visible" id="emptyState">
            <div class="empty-state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" width="24" height="24">
                    <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <h2 id="emptyTitle">No courses available yet</h2>
            <p id="emptyText">Courses will appear here when they are published.</p>
        </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Home</span>
        </a>
        <a href="videos.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
            </svg>
            <span>Videos</span>
        </a>
        <a class="active" href="courses.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M4 5.5v16M8 7h8M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Courses</span>
        </a>
        <a href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 0 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1A2 2 0 0 1 3 15.1l.1-.1A2 2 0 0 0 1.7 11.6h-.2a2 2 0 0 1 0-4h.2A2 2 0 0 0 3.1 4.2L3 4.1A2 2 0 0 1 5.8 1.3l.1.1a2 2 0 0 0 3.4-1.4v-.2a2 2 0 0 1 4 0V0a2 2 0 0 0 3.4 1.4l.1-.1A2 2 0 0 1 19.6 4l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 0 1 0 4h-.2a2 2 0 0 0-1.5 3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
        const searchInput = document.getElementById("courseSearch");
        const categorySelect = document.getElementById("courseCategory");
        const coursesGrid = document.getElementById("coursesGrid");
        const emptyState = document.getElementById("emptyState");
        const emptyTitle = document.getElementById("emptyTitle");
        const emptyText = document.getElementById("emptyText");
        const profileAvatar = document.getElementById("profileAvatar");
        const notificationButton = document.getElementById("notificationButton");

        const icons = {
            book: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 5.5v16M8 7h8M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
            spark: '<svg viewBox="0 0 24 24" fill="none"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
            code: '<svg viewBox="0 0 24 24" fill="none"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            bot: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M8 11h.01M16 11h.01M8 16h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
        };

        function getLocalProfile() {
            try {
                return JSON.parse(localStorage.getItem("lexon_profile") || "null");
            } catch {
                return null;
            }
        }

        function updateAvatar() {
            const profile = getLocalProfile();
            const name = profile?.name || profile?.full_name || "";
            profileAvatar.textContent = name.trim() ? name.trim().charAt(0).toUpperCase() : "?";
        }

        function createCourseCard(course) {
            const card = document.createElement("article");
            card.className = "course-card";
            card.dataset.category = course.category || "all";
            card.dataset.search = `${course.title || ""} ${course.description || ""} ${course.category || ""}`.toLowerCase();

            const icon = icons[course.icon] || icons.book;
            const category = course.categoryLabel || course.category || "Course";

            card.innerHTML = `
                <div class="course-icon" aria-hidden="true">${icon}</div>
                <h2>${escapeHtml(course.title || "Untitled course")}</h2>
                <p>${escapeHtml(course.description || "Explore this learning resource.")}</p>
                <div class="course-meta">
                    <span class="course-tag">${escapeHtml(category)}</span>
                    ${course.url ? `<a class="course-link" href="${escapeAttribute(course.url)}" target="_blank" rel="noopener noreferrer">Open course</a>` : ""}
                </div>
            `;

            return card;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return String(value).replaceAll('"', "&quot;");
        }

        function renderCourses(courses) {
            coursesGrid.replaceChildren();

            if (!Array.isArray(courses) || courses.length === 0) {
                emptyTitle.textContent = "No courses available yet";
                emptyText.textContent = "Courses will appear here when they are published.";
                emptyState.classList.add("visible");
                return;
            }

            courses.forEach(course => {
                coursesGrid.appendChild(createCourseCard(course));
            });

            filterCourses();
        }

        function filterCourses() {
            const query = searchInput.value.trim().toLowerCase();
            const category = categorySelect.value;
            const cards = [...coursesGrid.querySelectorAll(".course-card")];

            let visibleCount = 0;

            cards.forEach(card => {
                const matchesSearch = !query || card.dataset.search.includes(query);
                const matchesCategory = category === "all" || card.dataset.category === category;
                const visible = matchesSearch && matchesCategory;

                card.hidden = !visible;

                if (visible) {
                    visibleCount += 1;
                }
            });

            if (cards.length && visibleCount === 0) {
                emptyTitle.textContent = "No matching courses";
                emptyText.textContent = "Try a different search or category.";
                emptyState.classList.add("visible");
            } else if (cards.length) {
                emptyState.classList.remove("visible");
            }
        }

        async function loadCourses() {
            const client = window.LexonSupabase?.client();

            if (!client) {
                renderCourses([]);
                return;
            }

            try {
                const { data, error } = await client
                    .from("courses")
                    .select("*")
                    .eq("status", "published")
                    .order("created_at", { ascending: false });

                if (error) {
                    renderCourses([]);
                    return;
                }

                renderCourses(data || []);
            } catch {
                renderCourses([]);
            }
        }

        searchInput.addEventListener("input", filterCourses);
        categorySelect.addEventListener("change", filterCourses);

        updateAvatar();
        loadCourses();
    </script>
  <script src="../js/notifications.js"></script>
</body>
</html>
