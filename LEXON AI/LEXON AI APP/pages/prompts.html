<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">
    <meta name="description" content="Discover and manage AI prompts.">
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>Prompts</title>

    <style>
        .page-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 110px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
        }

        .page-header p {
            margin: 0;
            max-width: 680px;
            color: #667085;
            line-height: 1.6;
        }

        .prompt-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .prompt-search {
            flex: 1 1 280px;
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 16px;
            background: var(--lexon-surface);
            color: var(--lexon-text);
            font: inherit;
            outline: none;
        }

        .prompt-search:focus {
            border-color: var(--lexon-accent);
            box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.1);
        }

        .prompt-filter {
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 38px 0 14px;
            background: var(--lexon-surface);
            color: #344054;
            font: inherit;
            cursor: pointer;
        }

        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .prompt-card {
            display: flex;
            flex-direction: column;
            min-height: 280px;
            padding: 22px;
            border: 1px solid #eaecf0;
            border-radius: 20px;
            background: var(--lexon-surface);
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.05);
        }

        .prompt-card[hidden] {
            display: none;
        }

        .prompt-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .prompt-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #f4f3ff;
            color: var(--lexon-accent);
        }

        .prompt-icon svg {
            width: 22px;
            height: 22px;
        }

        .prompt-tag {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            background: #f2f4f7;
            color: #475467;
            font-size: 12px;
            font-weight: 600;
        }

        .prompt-card h2 {
            margin: 0 0 10px;
            color: var(--lexon-text);
            font-size: 19px;
            line-height: 1.35;
        }

        .prompt-content {
            margin: 0;
            padding: 15px;
            border: 1px solid #eaecf0;
            border-radius: 14px;
            background: #f9fafb;
            color: #475467;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 18px;
        }

        .prompt-button {
            min-height: 40px;
            padding: 0 14px;
            border-radius: 11px;
            border: 1px solid #d0d5dd;
            background: var(--lexon-surface);
            color: #344054;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .prompt-button:hover {
            background: #f9fafb;
        }

        .prompt-button.primary {
            border-color: var(--lexon-accent);
            background: var(--lexon-accent);
            color: var(--lexon-surface);
        }

        .prompt-button.primary:hover {
            background: #5148e5;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 64px 24px;
            border: 1px dashed #d0d5dd;
            border-radius: 20px;
            background: #fcfcfd;
        }

        .empty-state.visible {
            display: block;
        }

        .empty-state-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #f2f4f7;
            color: #667085;
        }

        .empty-state h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: var(--lexon-text);
        }

        .empty-state p {
            margin: 0 auto;
            max-width: 480px;
            color: #667085;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .page-shell {
                width: min(100% - 24px, 1180px);
                padding-top: 24px;
            }

            .prompts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="brand" aria-label="Home">
                <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
                <span class="brand-name">LEXON AI</span>
            </a>

            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="../index.html">Home</a>
                <a href="videos.html">Videos</a>
                <a href="courses.html">Courses</a>
                <a href="tools.html">Tools</a>
                <a href="guides.html">Guides</a>
            </nav>

            <div class="header-actions">
                <button class="icon-button" type="button" id="notificationButton" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <a href="profile.html" class="avatar-link" aria-label="Profile">
                    <span class="avatar" id="profileAvatar">?</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-header">
            <h1>Prompts</h1>
            <p>Find practical prompts designed to help you work faster with AI.</p>
        </section>

        <section class="prompt-toolbar" aria-label="Prompt filters">
            <input
                class="prompt-search"
                id="promptSearch"
                type="search"
                placeholder="Search prompts..."
                autocomplete="off"
                aria-label="Search prompts"
            >

            <select class="prompt-filter" id="promptCategory" aria-label="Filter prompts by category">
                <option value="all">All categories</option>
                <option value="writing">Writing</option>
                <option value="content">Content</option>
                <option value="marketing">Marketing</option>
                <option value="productivity">Productivity</option>
                <option value="coding">Coding</option>
                <option value="business">Business</option>
                <option value="research">Research</option>
            </select>
        </section>

        <section class="prompts-grid" id="promptsGrid" aria-live="polite"></section>

        <section class="empty-state visible" id="emptyState">
            <div class="empty-state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" width="24" height="24">
                    <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/>
                    <path d="m7 8 2 2-2 2M11 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 id="emptyTitle">No prompts available yet</h2>
            <p id="emptyText">Prompts will appear here when they are published.</p>
        </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Home</span>
        </a>

        <a href="videos.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
            </svg>
            <span>Videos</span>
        </a>

        <a href="courses.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M4 5.5v16M8 7h8M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Courses</span>
        </a>

        <a href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                <path d="M19.4 15a2 2 0 0 0 .4 2.2l.1.1-2.1 2.1-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.1-2.1.1-.1A2 2 0 0 0 6.2 15a2 2 0 0 0-1.8-1.2h-.2v-3h.2A2 2 0 0 0 6.2 9a2 2 0 0 0-.4-2.2l-.1-.1 2.1-2.1.1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 11.3 3v-.2h3V3a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1 2.1 2.1-.1.1A2 2 0 0 0 19.4 9a2 2 0 0 0 1.8 1.2h.2v3h-.2a2 2 0 0 0-1.8 1.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span>Settings</span>
        </a>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <script>
        const searchInput = document.getElementById("promptSearch");
        const categorySelect = document.getElementById("promptCategory");
        const promptsGrid = document.getElementById("promptsGrid");
        const emptyState = document.getElementById("emptyState");
        const emptyTitle = document.getElementById("emptyTitle");
        const emptyText = document.getElementById("emptyText");
        const profileAvatar = document.getElementById("profileAvatar");
        const notificationButton = document.getElementById("notificationButton");

        const promptIcon = `
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="m7 8 2 2-2 2M11 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function getLocalProfile() {
            try {
                return JSON.parse(localStorage.getItem("lexon_profile") || "null");
            } catch {
                return null;
            }
        }

        function updateAvatar() {
            const profile = getLocalProfile();
            const name = profile?.name || profile?.full_name || "";

            profileAvatar.textContent = name.trim()
                ? name.trim().charAt(0).toUpperCase()
                : "?";
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function createPromptCard(prompt) {
            const card = document.createElement("article");
            card.className = "prompt-card";

            const category = String(prompt.category || "prompt").toLowerCase();
            const categoryLabel = prompt.categoryLabel || prompt.category || "Prompt";
            const content = prompt.content || prompt.prompt || "";

            card.dataset.category = category;
            card.dataset.search = [
                prompt.title,
                prompt.description,
                content,
                prompt.category,
                prompt.tags
            ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            card.innerHTML = `
                <div class="prompt-card-top">
                    <div class="prompt-icon" aria-hidden="true">${promptIcon}</div>
                    <span class="prompt-tag">${escapeHtml(categoryLabel)}</span>
                </div>

                <h2>${escapeHtml(prompt.title || "Untitled prompt")}</h2>

                ${
                    prompt.description
                        ? `<p style="margin:0 0 12px;color:#667085;font-size:14px;line-height:1.6;">${escapeHtml(prompt.description)}</p>`
                        : ""
                }

                <div class="prompt-content">${escapeHtml(content)}</div>

                <div class="prompt-actions">
                    <button class="prompt-button primary copy-button" type="button">Copy prompt</button>
                    ${
                        prompt.url
                            ? `<a class="prompt-button" href="${escapeHtml(prompt.url)}" target="_blank" rel="noopener noreferrer">Open</a>`
                            : ""
                    }
                </div>
            `;

            const copyButton = card.querySelector(".copy-button");

            copyButton.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(content);
                    copyButton.textContent = "Copied";
                    setTimeout(() => {
                        copyButton.textContent = "Copy prompt";
                    }, 1600);
                } catch {
                    copyButton.textContent = "Copy unavailable";
                    setTimeout(() => {
                        copyButton.textContent = "Copy prompt";
                    }, 1600);
                }
            });

            return card;
        }

        function renderPrompts(prompts) {
            promptsGrid.replaceChildren();

            if (!Array.isArray(prompts) || prompts.length === 0) {
                emptyTitle.textContent = "No prompts available yet";
                emptyText.textContent = "Prompts will appear here when they are published.";
                emptyState.classList.add("visible");
                return;
            }

            prompts.forEach(prompt => {
                promptsGrid.appendChild(createPromptCard(prompt));
            });

            filterPrompts();
        }

        function filterPrompts() {
            const query = searchInput.value.trim().toLowerCase();
            const category = categorySelect.value;
            const cards = [...promptsGrid.querySelectorAll(".prompt-card")];

            let visibleCount = 0;

            cards.forEach(card => {
                const matchesSearch =
                    !query || card.dataset.search.includes(query);

                const matchesCategory =
                    category === "all" ||
                    card.dataset.category === category;

                const visible = matchesSearch && matchesCategory;

                card.hidden = !visible;

                if (visible) {
                    visibleCount += 1;
                }
            });

            if (cards.length && visibleCount === 0) {
                emptyTitle.textContent = "No matching prompts";
                emptyText.textContent = "Try a different search or category.";
                emptyState.classList.add("visible");
            } else if (cards.length) {
                emptyState.classList.remove("visible");
            }
        }

        async function loadPrompts() {
            const client = window.LexonSupabase?.client();

            if (!client) {
                renderPrompts([]);
                return;
            }

            try {
                const { data, error } = await client
                    .from("prompts")
                    .select("*")
                    .eq("status", "published")
                    .order("created_at", { ascending: false });

                if (error) {
                    renderPrompts([]);
                    return;
                }

                renderPrompts(data || []);
            } catch {
                renderPrompts([]);
            }
        }

        searchInput.addEventListener("input", filterPrompts);
        categorySelect.addEventListener("change", filterPrompts);

        updateAvatar();
        loadPrompts();
    </script>
  <script src="../js/notifications.js"></script>
</body>
</html>
