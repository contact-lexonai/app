<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Contact & Support — LEXON AI</title>

  <script src="../js/theme.js"></script>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/logos/lexon-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    .contact-shell {
      width: min(520px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 110px;
    }

    .legal-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      color: var(--lexon-text-secondary);
      font-size: 13px;
      font-weight: 600;
    }

    .legal-back svg { width: 16px; height: 16px; }

    .contact-shell h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
    }

    .contact-shell > p.lead {
      margin: 0 0 22px;
      color: var(--lexon-text-secondary);
      font-size: 13.5px;
    }

    .contact-card {
      padding: 24px;
      border: 1px solid var(--lexon-border);
      border-radius: var(--lexon-radius-lg);
      background: var(--lexon-surface);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html" aria-label="LEXON AI Home">
        <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
        <span class="brand-name">LEXON AI</span>
      </a>
    </div>
  </header>

  <main class="contact-shell">
    <a class="legal-back" href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      Back to Settings
    </a>

    <h1>Contact &amp; Support</h1>
    <p class="lead">Have an issue or a question? Send us a message and we'll get back to you.</p>

    <div class="contact-card">
      <form id="contactForm">
        <div class="form-group">
          <label for="contactSubject">Subject</label>
          <input type="text" id="contactSubject" required placeholder="e.g. Trouble listing a video">
        </div>

        <div class="form-group" style="margin-top:14px;">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" required placeholder="Describe the issue or question in detail…" rows="6" class="form-input"></textarea>
        </div>

        <p class="form-message" id="contactMessageStatus" style="margin-top:10px;"></p>

        <button class="btn btn-primary" type="submit" id="contactSubmit" style="width:100%; margin-top:6px;">
          Send
        </button>
      </form>
    </div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path><path d="M9 22V12h6v10"></path></svg>
      <span>Home</span>
    </a>
    <a href="videos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>
      <span>Videos</span>
    </a>
    <a href="courses.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5Z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
      <span>Courses</span>
    </a>
    <a href="settings.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("contactMessageStatus");
    const submitBtn = document.getElementById("contactSubmit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.classList.remove("error", "success");

      const subject = document.getElementById("contactSubject").value.trim();
      const message = document.getElementById("contactMessage").value.trim();

      const client = window.LexonSupabase?.client();
      const user = await window.LexonSupabase?.getCurrentUser();

      if (!client || !user) {
        statusEl.textContent = "Please log in to send a support message.";
        statusEl.classList.add("error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      const { error } = await client.from("support_messages").insert({
        user_id: user.id,
        subject,
        message
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Send";

      if (error) {
        statusEl.textContent = "Could not send your message: " + error.message;
        statusEl.classList.add("error");
        return;
      }

      form.reset();
      statusEl.textContent = "Message sent — we'll get back to you soon.";
      statusEl.classList.add("success");
    });
  </script>
</body>
</html>
