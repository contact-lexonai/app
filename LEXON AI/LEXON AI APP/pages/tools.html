<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">
    <meta name="description" content="Discover and explore AI tools.">
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>AI Tools</title>

    <style>
        .page-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 110px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
        }

        .page-header p {
            margin: 0;
            max-width: 650px;
            color: #667085;
            line-height: 1.6;
        }

        .tool-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .tool-search {
            flex: 1 1 280px;
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 16px;
            background: var(--lexon-surface);
            color: var(--lexon-text);
            font: inherit;
            outline: none;
        }

        .tool-search:focus {
            border-color: var(--lexon-accent);
            box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.1);
        }

        .tool-filter {
            min-height: 48px;
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 0 38px 0 14px;
            background: var(--lexon-surface);
            color: #344054;
            font: inherit;
            cursor: pointer;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            min-height: 260px;
            padding: 22px;
            border: 1px solid #eaecf0;
            border-radius: 20px;
            background: var(--lexon-surface);
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.05);
        }

        .tool-card[hidden] {
            display: none;
        }

        .tool-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #f4f3ff;
            color: var(--lexon-accent);
            margin-bottom: 18px;
        }

        .tool-icon svg {
            width: 23px;
            height: 23px;
        }

        .tool-card h2 {
            margin: 0 0 9px;
            font-size: 19px;
            line-height: 1.35;
            color: var(--lexon-text);
        }

        .tool-card p {
            margin: 0;
            color: #667085;
            line-height: 1.6;
            font-size: 14px;
        }

        .tool-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 20px;
        }

        .tool-tag {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 999px;
            background: #f2f4f7;
            color: #475467;
            font-size: 12px;
            font-weight: 600;
        }

        .tool-link {
            margin-left: auto;
            color: var(--lexon-accent);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .tool-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 64px 24px;
            border: 1px dashed #d0d5dd;
            border-radius: 20px;
            background: #fcfcfd;
        }

        .empty-state.visible {
            display: block;
        }

        .empty-state-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #f2f4f7;
            color: #667085;
        }

        .empty-state h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: var(--lexon-text);
        }

        .empty-state p {
            margin: 0 auto;
            max-width: 480px;
            color: #667085;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .tools-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                width: min(100% - 24px, 1180px);
                padding-top: 24px;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }

            .tool-card {
                min-height: 240px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="brand" aria-label="Home">
                <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
                <span class="brand-name">LEXON AI</span>
            </a>

            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="../index.html">Home</a>
                <a href="videos.html">Videos</a>
                <a href="courses.html">Courses</a>
                <a class="active" href="tools.html">Tools</a>
                <a href="guides.html">Guides</a>
            </nav>

            <div class="header-actions">
                <button class="icon-button" type="button" id="notificationButton" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <a href="profile.html" class="avatar-link" aria-label="Profile">
                    <span class="avatar" id="profileAvatar">?</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-header">
            <h1>AI Tools</h1>
            <p>Discover useful AI tools for learning, creating, automating and building.</p>
        </section>

        <section class="tool-toolbar" aria-label="Tool filters">
            <input
                class="tool-search"
                id="toolSearch"
                type="search"
                placeholder="Search AI tools..."
                autocomplete="off"
                aria-label="Search AI tools"
            >

            <select class="tool-filter" id="toolCategory" aria-label="Filter tools by category">
                <option value="all">All categories</option>
                <option value="writing">Writing</option>
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="audio">Audio</option>
                <option value="automation">Automation</option>
                <option value="coding">Coding</option>
                <option value="productivity">Productivity</option>
            </select>
        </section>

        <section class="tools-grid" id="toolsGrid" aria-live="polite"></section>

        <section class="empty-state visible" id="emptyState">
            <div class="empty-state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" width="24" height="24">
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.64 5.64l2.12 2.12M16.24 16.24l2.12 2.12M18.36 5.64l-2.12 2.12M7.76 16.24l-2.12 2.12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </div>
            <h2 id="emptyTitle">No tools available yet</h2>
            <p id="emptyText">AI tools will appear here when they are published.</p>
        </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Home</span>
        </a>

        <a href="videos.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
            </svg>
            <span>Videos</span>
        </a>

        <a href="courses.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M4 5.5v16M8 7h8M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Courses</span>
        </a>

        <a href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                <path d="M19.4 15a2 2 0 0 0 .4 2.2l.1.1-2.1 2.1-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.1-2.1.1-.1A2 2 0 0 0 6.2 15a2 2 0 0 0-1.8-1.2h-.2v-3h.2A2 2 0 0 0 6.2 9a2 2 0 0 0-.4-2.2l-.1-.1 2.1-2.1.1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 11.3 3v-.2h3V3a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1 2.1 2.1-.1.1A2 2 0 0 0 19.4 9a2 2 0 0 0 1.8 1.2h.2v3h-.2a2 2 0 0 0-1.8 1.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <script>
        const searchInput = document.getElementById("toolSearch");
        const categorySelect = document.getElementById("toolCategory");
        const toolsGrid = document.getElementById("toolsGrid");
        const emptyState = document.getElementById("emptyState");
        const emptyTitle = document.getElementById("emptyTitle");
        const emptyText = document.getElementById("emptyText");
        const profileAvatar = document.getElementById("profileAvatar");
        const notificationButton = document.getElementById("notificationButton");

        const icons = {
            spark: `
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            `,
            image: `
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="8.5" cy="9" r="1.5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="m4 17 5-5 3.5 3 2.5-2.5L20 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `,
            video: `
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
                </svg>
            `,
            code: `
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `,
            automation: `
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7 7h10M7 17h10M5 5h.01M5 15h.01M19 5h.01M19 15h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M9 7v10M15 7v10" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            `
        };

        function getLocalProfile() {
            try {
                return JSON.parse(localStorage.getItem("lexon_profile") || "null");
            } catch {
                return null;
            }
        }

        function updateAvatar() {
            const profile = getLocalProfile();
            const name = profile?.name || profile?.full_name || "";
            profileAvatar.textContent = name.trim()
                ? name.trim().charAt(0).toUpperCase()
                : "?";
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return String(value).replaceAll('"', "&quot;");
        }

        function createToolCard(tool) {
            const card = document.createElement("article");
            card.className = "tool-card";

            const category = String(tool.category || "tool").toLowerCase();
            const categoryLabel = tool.categoryLabel || tool.category || "Tool";

            card.dataset.category = category;
            card.dataset.search = [
                tool.name,
                tool.title,
                tool.description,
                tool.category,
                tool.tags
            ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            const icon = icons[tool.icon] || icons.spark;

            card.innerHTML = `
                <div class="tool-icon" aria-hidden="true">${icon}</div>
                <h2>${escapeHtml(tool.name || tool.title || "Untitled tool")}</h2>
                <p>${escapeHtml(tool.description || "Explore this AI tool.")}</p>
                <div class="tool-meta">
                    <span class="tool-tag">${escapeHtml(categoryLabel)}</span>
                    ${
                        tool.url
                            ? `<a class="tool-link" href="${escapeAttribute(tool.url)}" target="_blank" rel="noopener noreferrer">Open tool</a>`
                            : ""
                    }
                </div>
            `;

            return card;
        }

        function renderTools(tools) {
            toolsGrid.replaceChildren();

            if (!Array.isArray(tools) || tools.length === 0) {
                emptyTitle.textContent = "No tools available yet";
                emptyText.textContent = "AI tools will appear here when they are published.";
                emptyState.classList.add("visible");
                return;
            }

            tools.forEach(tool => {
                toolsGrid.appendChild(createToolCard(tool));
            });

            filterTools();
        }

        function filterTools() {
            const query = searchInput.value.trim().toLowerCase();
            const category = categorySelect.value;
            const cards = [...toolsGrid.querySelectorAll(".tool-card")];

            let visibleCount = 0;

            cards.forEach(card => {
                const matchesSearch =
                    !query || card.dataset.search.includes(query);

                const matchesCategory =
                    category === "all" ||
                    card.dataset.category === category;

                const visible = matchesSearch && matchesCategory;

                card.hidden = !visible;

                if (visible) {
                    visibleCount += 1;
                }
            });

            if (cards.length && visibleCount === 0) {
                emptyTitle.textContent = "No matching tools";
                emptyText.textContent = "Try a different search or category.";
                emptyState.classList.add("visible");
            } else if (cards.length) {
                emptyState.classList.remove("visible");
            }
        }

        function getSearchFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get("search") || "";
        }

        async function loadTools() {
            const client = window.LexonSupabase?.client();

            if (!client) {
                renderTools([]);
                return;
            }

            try {
                const { data, error } = await client
                    .from("tools")
                    .select("*")
                    .eq("status", "published")
                    .order("created_at", { ascending: false });

                if (error) {
                    renderTools([]);
                    return;
                }

                renderTools(data || []);
            } catch {
                renderTools([]);
            }
        }

        searchInput.value = getSearchFromUrl();

        searchInput.addEventListener("input", filterTools);
        categorySelect.addEventListener("change", filterTools);

        updateAvatar();
        loadTools();
    </script>
  <script src="../js/notifications.js"></script>
</body>
</html>
