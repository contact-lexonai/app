<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Search — LEXON AI</title>

  <script src="../js/theme.js"></script>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/logos/lexon-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    .search-shell {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 110px;
    }

    .search-topics-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 16px 0 28px;
    }

    .search-topic-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--lexon-border-strong);
      background: var(--lexon-surface);
      color: var(--lexon-text-secondary);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search-topic-chip.active {
      border-color: var(--lexon-accent);
      background: var(--lexon-accent-soft);
      color: var(--lexon-accent);
    }

    .search-result-section {
      margin-bottom: 34px;
    }

    .search-result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .search-result-heading h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .search-result-heading a {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--lexon-accent);
    }

    .search-result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .search-result-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px;
      border: 1px solid var(--lexon-border);
      border-radius: var(--lexon-radius-lg);
      background: var(--lexon-surface);
      transition: box-shadow 160ms ease, transform 160ms ease;
    }

    .search-result-card:hover {
      box-shadow: var(--lexon-shadow-md);
      transform: translateY(-2px);
    }

    .search-result-card .tag {
      align-self: flex-start;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--lexon-accent-soft);
      color: var(--lexon-accent);
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .search-result-card h3 {
      margin: 2px 0 0;
      font-size: 14.5px;
      font-weight: 750;
      line-height: 1.35;
    }

    .search-result-card p {
      margin: 0;
      color: var(--lexon-text-secondary);
      font-size: 12.5px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .search-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--lexon-text-secondary);
    }

    .search-loading {
      padding: 60px 20px;
      text-align: center;
      color: var(--lexon-text-secondary);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html" aria-label="LEXON AI Home">
        <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
        <span class="brand-name">LEXON AI</span>
      </a>
      <div class="header-actions">
        <a class="icon-button avatar-link" href="profile.html" aria-label="Profile">
          <span class="avatar" id="profileAvatar">?</span>
        </a>
      </div>
    </div>
  </header>

  <main class="search-shell">
    <div class="lexon-search" style="margin-top:0;">
      <span class="lexon-search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      </span>
      <input type="search" id="searchInput" placeholder="Search anything in AI…">
    </div>

    <div class="search-topics-row" id="topicsRow"></div>

    <div id="resultsContainer">
      <div class="search-loading">Searching…</div>
    </div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path><path d="M9 22V12h6v10"></path></svg>
      <span>Home</span>
    </a>
    <a href="videos.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>
      <span>Videos</span>
    </a>
    <a href="courses.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5Z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
      <span>Courses</span>
    </a>
    <a href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/search-intents.js"></script>
  <script>
    const RESOURCE_TYPES = [
      { key: "courses", label: "Courses", href: "courses.html" },
      { key: "prompts", label: "Prompt Library", href: "prompts.html" },
      { key: "videos", label: "Videos", href: "videos.html" },
      { key: "tools", label: "AI Tools", href: "tools.html" },
      { key: "guides", label: "Guides", href: "guides.html" }
    ];

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function getQueryFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("q") || params.get("search") || "";
    }

    function renderTopicChips(matches, activeId) {
      const row = document.getElementById("topicsRow");
      if (!matches.length) {
        row.innerHTML = "";
        return;
      }

      row.innerHTML = matches
        .map((m) => `
          <button type="button" class="search-topic-chip ${m.id === activeId ? "active" : ""}" data-topic="${m.id}">
            ${escapeHTML(m.label)}
          </button>
        `)
        .join("");

      row.querySelectorAll(".search-topic-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          runSearch(document.getElementById("searchInput").value, chip.dataset.topic);
        });
      });
    }

    function cardHTML(item, typeLabel, href) {
      const title = item.title || "Untitled";
      const description = item.description || "";
      return `
        <a class="search-result-card" href="${href}">
          <span class="tag">${escapeHTML(typeLabel)}</span>
          <h3>${escapeHTML(title)}</h3>
          ${description ? `<p>${escapeHTML(description)}</p>` : ""}
        </a>
      `;
    }

    async function runSearch(rawQuery, forcedTopicId) {
      const query = (rawQuery || "").trim();
      const container = document.getElementById("resultsContainer");
      container.innerHTML = '<div class="search-loading">Searching…</div>';

      if (!query) {
        container.innerHTML = '<div class="search-empty">Type what you want to learn or create.</div>';
        renderTopicChips([], null);
        return;
      }

      const matches = window.LexonSearchIntents.matchIntents(query);
      const activeTopic = forcedTopicId
        ? window.LexonSearchIntents.getTopic(forcedTopicId)
        : (matches[0] ? window.LexonSearchIntents.getTopic(matches[0].id) : null);
      const activeTopicId = forcedTopicId || (matches[0] && matches[0].id) || null;

      renderTopicChips(matches, activeTopicId);

      // Category tags to filter by — either the matched topic's own
      // tag, or (for a topic like "Content Creation" that spans
      // several categories) all of its related topics' tags.
      let categoryTags = [];
      if (activeTopic) {
        if (activeTopic.categoryTag) {
          categoryTags = [activeTopic.categoryTag];
        } else if (activeTopic.relatedTopics) {
          categoryTags = activeTopic.relatedTopics
            .map((id) => window.LexonSearchIntents.getTopic(id))
            .filter(Boolean)
            .map((t) => t.categoryTag)
            .filter(Boolean);
        }
      }

      const resultsByType = {};

      await Promise.all(
        RESOURCE_TYPES.map(async (type) => {
          let items = [];

          if (categoryTags.length) {
            const perCategory = await Promise.all(
              categoryTags.map((tag) =>
                window.LexonContent.getResources(type.key, { category: tag, limit: 8 })
              )
            );
            items = perCategory.flat();
          }

          // Always also run a plain text search so exact keyword
          // matches on title/description are never missed, even
          // when no topic was confidently detected.
          const textMatches = await window.LexonContent.getResources(type.key, {
            search: query,
            limit: 8
          });

          const seen = new Set();
          items = items.concat(textMatches).filter((item) => {
            if (seen.has(item.id)) return false;
            seen.add(item.id);
            return true;
          });

          resultsByType[type.key] = items;
        })
      );

      const totalResults = Object.values(resultsByType).reduce((sum, arr) => sum + arr.length, 0);

      if (totalResults === 0) {
        container.innerHTML = `
          <div class="search-empty">
            No results yet for "${escapeHTML(query)}"${activeTopic ? ` in ${escapeHTML(activeTopic.label)}` : ""}.
            <br>New content is added regularly — check back soon.
          </div>
        `;
        return;
      }

      container.innerHTML = RESOURCE_TYPES
        .filter((type) => resultsByType[type.key].length > 0)
        .map((type) => `
          <section class="search-result-section">
            <div class="search-result-heading">
              <h2>${escapeHTML(type.label)}</h2>
              <a href="${type.href}${activeTopic ? `?category=${encodeURIComponent(activeTopic.categoryTag || "")}` : ""}">View all →</a>
            </div>
            <div class="search-result-grid">
              ${resultsByType[type.key]
                .slice(0, 6)
                .map((item) => cardHTML(item, type.label.replace(/s$/, ""), `${type.href}?id=${item.id}`))
                .join("")}
            </div>
          </section>
        `)
        .join("");
    }

    const searchInput = document.getElementById("searchInput");
    let debounceTimer = null;

    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => runSearch(searchInput.value), 350);
    });

    searchInput.value = getQueryFromURL();
    runSearch(searchInput.value);

    // Keep the header avatar consistent with the rest of the app.
    (async () => {
      const client = window.LexonSupabase?.client();
      const user = client && (await window.LexonSupabase.getCurrentUser());
      if (!user) return;
      const { data: profile } = await client.from("profiles").select("name, avatar_url").eq("id", user.id).maybeSingle();
      const el = document.getElementById("profileAvatar");
      if (!el) return;
      if (profile?.avatar_url) {
        el.innerHTML = `<img src="${profile.avatar_url}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else if (profile?.name) {
        el.textContent = profile.name.trim().charAt(0).toUpperCase();
      }
    })();
  </script>
</body>
</html>
